name: Menyskanning

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5,8 * * 1-5'
    - cron: '0 6,9 * * 1-5'

concurrency:
  group: mums-menyskanning
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  skanna:
    if: github.event.repository.private == true
    runs-on: ubuntu-latest
    steps:
      - name: Kontrollera svensk sommar- eller vintertid
        id: tid
        env:
          SCHEMA: ${{ github.event.schedule }}
        run: |
          zone=$(TZ=Europe/Stockholm date +%z)
          if [[ -z "$SCHEMA" || ( "$zone" == +0200 && "$SCHEMA" == '0 5,8 * * 1-5' ) || ( "$zone" == +0100 && "$SCHEMA" == '0 6,9 * * 1-5' ) ]]; then
            echo 'kor=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.tid.outputs.kor == 'true'
      - uses: actions/setup-node@v4
        if: steps.tid.outputs.kor == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Läs tidigare privat skanning
        if: steps.tid.outputs.kor == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if listing=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts" -X GET -f name=privat-menydata -F per_page=100); then
            run_id=$(jq -r --arg branch "$GITHUB_REF_NAME" '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == $branch)] | max_by(.created_at) | .workflow_run.id // empty' <<< "$listing")
            if [[ -n "$run_id" ]]; then
              gh run download "$run_id" --name privat-menydata --dir .mums || echo 'Ingen tidigare privat menydata tillgänglig.'
            fi
          else
            echo 'Kunde inte lista tidigare privat menydata.'
          fi
      - name: Installera och skanna
        if: steps.tid.outputs.kor == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          npm ci
          npm run scan
      - name: Spara menydata i det privata repot
        if: steps.tid.outputs.kor == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: privat-menydata
          path: .mums/scan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
