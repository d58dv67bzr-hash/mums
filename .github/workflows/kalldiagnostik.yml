name: Källdiagnostik

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostik:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run diagnose
